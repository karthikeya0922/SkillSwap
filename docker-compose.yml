# Full stack: MySQL + Spring Boot API + nginx-served React app.
# Usage: cp .env.example .env  (fill in secrets)  &&  docker compose up --build
# Then open http://localhost:3000
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skillswap
      MYSQL_USER: skillswap
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/skillswap?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: skillswap
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@skillswap.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
  uploads:
