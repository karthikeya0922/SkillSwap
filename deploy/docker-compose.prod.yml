# Production overlay for a single server: auto-restart everything and put Caddy in front for HTTPS.
# Usage: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
services:
  mysql:
    restart: unless-stopped

  backend:
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    # Only Caddy is reachable from the internet.
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
