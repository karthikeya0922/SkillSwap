# Render Blueprint: free Docker web service for the API plus a free static site for the React app.
# The database is an external free MySQL (Aiven); paste its connection details when Render asks.
# If Render gives a service a different URL than the name below, update the URLs here and in its env vars.
services:
  - type: web
    name: skillswap-api-karthikeya
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/categories
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      # Free instances have 512 MB; keep the JVM well inside that.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - key: DB_URL
        sync: false # jdbc:mysql://<aiven-host>:<port>/defaultdb?sslMode=REQUIRED&serverTimezone=Asia/Kolkata
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://skillswap-karthikeya.onrender.com
      - key: SEED_ENABLED
        value: "true"
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@skillswap.dev
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: skillswap-karthikeya
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://skillswap-api-karthikeya.onrender.com/api
      - key: VITE_WS_URL
        value: wss://skillswap-api-karthikeya.onrender.com/ws
      - key: VITE_BACKEND_URL_PUBLIC
        value: https://skillswap-api-karthikeya.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
