# Render's free plan sleeps the API after 15 idle minutes; ping it so it stays warm.
# GitHub may start scheduled runs a few minutes late, so this runs more often than strictly needed.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://skillswap-api-karthikeya.onrender.com/api/categories
