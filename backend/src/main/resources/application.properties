spring.application.name=skillswap

# Local secrets live in backend/.env (git-ignored); real deployments use environment variables.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# --- Database (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillswap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:skillswap}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Uploads ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.uploads.dir=${UPLOADS_DIR:uploads}

# --- Security ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Credits economy ---
app.wallet.signup-bonus=${SIGNUP_BONUS_CREDITS:5}

# --- Demo data (disable in production) ---
app.seed.enabled=${SEED_ENABLED:true}
app.seed.demo-password=${SEED_DEMO_PASSWORD:}
app.seed.admin-email=${ADMIN_EMAIL:admin@skillswap.dev}
app.seed.admin-password=${ADMIN_PASSWORD:}

# --- Logging (see logback-spring.xml: readable console + JSON file in LOG_PATH) ---
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.web.socket=warn
app.logging.slow-request-ms=${SLOW_REQUEST_MS:1000}
logging.pattern.correlation=[%8.8X{requestId}] 

# --- Async work (@Async notification pushes) ---
spring.task.execution.thread-name-prefix=skillswap-async-
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=500

# --- Monitoring (Actuator): /actuator/health is public, everything else is admin-only ---
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
info.app.name=SkillSwap API
info.app.version=@project.version@

# --- API docs (Swagger UI at /swagger-ui.html) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.skillswap
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
