spring.datasource.url=jdbc:h2:mem:skillswap;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.uploads.dir=target/test-uploads
app.jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173
app.wallet.signup-bonus=5
app.seed.enabled=false
app.seed.demo-password=
app.seed.admin-email=admin@skillswap.dev
app.seed.admin-password=
logging.file.path=target/test-logs
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
springdoc.packages-to-scan=com.skillswap
springdoc.paths-to-match=/api/**
